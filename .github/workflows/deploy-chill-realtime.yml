name: Deploy Chill realtime (manual)

# No push, pull_request, schedule or workflow_run deployment trigger.
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Deploy the public Chill Worker from sprint-1-campus-map (free-plan account only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-vnu-chill-realtime
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'kaze0094/vnu-life-map' &&
      github.ref == 'refs/heads/sprint-1-campus-map' &&
      inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_SANITIZE: 'true'
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Check required secrets without displaying values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the repository secret CLOUDFLARE_API_TOKEN.'
            exit 1
          fi
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo '::error::Add CLOUDFLARE_ACCOUNT_ID as a 32-character account ID, not a Zone ID.'
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck Next.js and Worker
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build validation only (no Vercel deployment)
        run: npm run build
      - name: Validate Worker bundle and configuration without deploying
        run: npm run realtime:check
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config realtime/wrangler.jsonc
      - name: Next steps
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Worker deployment completed
          Find the public `https://vnu-chill-realtime.<subdomain>.workers.dev` URL in the **Deploy Cloudflare Worker** log, or in Cloudflare → Workers & Pages → vnu-chill-realtime → Settings → Domains & Routes.

          Open `<Worker URL>/health`. Then set `NEXT_PUBLIC_CHILL_REALTIME_URL` to the Worker origin in **Vercel Preview only**, and redeploy `sprint-1-campus-map`.

          Instructions: [Vietnamese dashboard-only guide](https://github.com/kaze0094/vnu-life-map/blob/sprint-1-campus-map/docs/chill-github-actions.md).

          This workflow does not merge branches, change billing plans, deploy Vercel, or enable real parking/card integrations.
          SUMMARY
